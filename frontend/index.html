<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Pokémon</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            color: #e3350d;
        }

        input, button {
            padding: 12px;
            margin: 5px;
            border-radius: 8px;
            font-size: 16px;
        }

        input {
            width: 60%;
            border: 1px solid #ccc;
        }

        button {
            background-color: #e3350d;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #b92709;
        }

        #mensaje {
            margin-top: 20px;
            font-weight: bold;
        }

        #resultado img {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }

        .tipo {
            display: inline-block;
            background-color: #e0e7ff;
            padding: 7px 12px;
            margin: 4px;
            border-radius: 15px;
        }
    </style>

    <script src="app.js" defer></script>
</head>

<body>
    <main class="contenedor">
        <h1>Buscador de Pokémon</h1>

        <p>Escribe el nombre de un Pokémon para consultar sus datos.</p>

        <form id="formulario">
            <input
                type="text"
                id="nombrePokemon"
                placeholder="Ejemplo: pikachu"
                aria-label="Nombre del Pokémon"
                required
            >

            <button type="submit">Buscar</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

        <section id="resultado" aria-label="Datos del Pokémon"></section>
    </main>
</body>
</html>
